<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BengaAnalytics | Enterprise BI</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div class="flex min-h-screen">
<aside class="w-72 bg-slate-900 border-r border-slate-800 p-5 flex flex-col">
<h1 class="text-2xl font-bold">Benga<span class="text-cyan-400">Analytics</span></h1>
<div id="profile" class="mt-8 p-4 rounded-xl bg-slate-800">Loading profile…</div>
<div id="tier-card" class="mt-4 p-4 rounded-xl border border-cyan-700 bg-cyan-950/30"></div>
<label class="mt-6 block text-sm font-medium">Upload Dataset</label>
<input id="file-input" type="file" accept=".csv,.xlsx" class="mt-2 block w-full text-sm">
<button id="upload-btn" class="mt-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-4 py-2 rounded-lg">Upload & Analyze</button>
<p id="status" class="mt-3 text-sm text-slate-400"></p>
<h2 class="mt-8 text-sm uppercase tracking-wider text-slate-400">Historical Datasets</h2>
<div id="dataset-list" class="mt-3 space-y-2 overflow-y-auto"></div>
</aside>
<main class="flex-1 p-5 md:p-8 overflow-x-hidden">
<div class="flex flex-col gap-4">
<div class="flex flex-col lg:flex-row gap-3">
<input id="global-search" placeholder="Search your data…" class="flex-1 rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 outline-none focus:border-cyan-400">
<select id="aggregation" class="rounded-xl bg-slate-900 border border-slate-700 px-4"><option value="sum">Sum</option><option value="avg">Average</option><option value="count">Count</option></select>
<select id="metric-select" class="rounded-xl bg-slate-900 border border-slate-700 px-4"></select>
<select id="group-select" class="rounded-xl bg-slate-900 border border-slate-700 px-4"></select>
<select id="chart-type" class="rounded-xl bg-slate-900 border border-slate-700 px-4"><option value="bar">Bar</option><option value="line">Line</option><option value="pie">Pie</option></select>
</div>
<div id="dynamic-filters" class="flex flex-wrap gap-3"></div>
</div>
<section class="grid grid-cols-1 xl:grid-cols-3 gap-5 mt-6">
<div class="xl:col-span-2 bg-slate-900 rounded-2xl border border-slate-800 p-5"><canvas id="main-chart"></canvas></div>
<div class="bg-slate-900 rounded-2xl border border-slate-800 p-5"><canvas id="secondary-chart"></canvas></div>
</section>
<section class="grid grid-cols-1 xl:grid-cols-3 gap-5 mt-5">
<div class="bg-slate-900 rounded-2xl border border-slate-800 p-5"><h2 class="font-semibold">Automated Insights</h2><ul id="insights" class="mt-3 space-y-3 text-slate-300"></ul></div>
<div class="xl:col-span-2 bg-slate-900 rounded-2xl border border-slate-800 p-5 overflow-auto"><h2 class="font-semibold mb-4">Raw Data Preview</h2><table id="raw-table" class="w-full text-sm text-left"></table></div>
</section>
</main></div>
<script src="/static/js/dashboard.js"></script>
</body></html>
